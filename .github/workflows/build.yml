name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build output type"
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build-android:
    name: Build Android (${{ inputs.build_type }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # EXPO_PUBLIC_SUPABASE_PASSWORD: ${{ secrets.EXPO_PUBLIC_SUPABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle memory and architectures
        run: |
          sed -i '/^org.gradle.jvmargs/d' android/gradle.properties
          sed -i '/^reactNativeArchitectures/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a" >> android/gradle.properties
          cat android/gradle.properties

      - name: Debug autolinking (shows the real Node error)
        run: |
          npx expo-modules-autolinking react-native-config --json --platform android > /dev/null
          echo "Autolinking OK"

      - name: Diagnose Gradle configuration (temporary)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew help --no-daemon --info --console=plain 2>&1 | tail -n 150

      - name: Build ${{ inputs.build_type }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "aab" ]; then
            ./gradlew bundleRelease --no-daemon --console=plain --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --console=plain --stacktrace
          fi

      - name: Upload ${{ inputs.build_type }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-build
          path: ${{ inputs.build_type == 'aab' && 'android/app/build/outputs/bundle/release/*.aab' || 'android/app/build/outputs/apk/release/*.apk' }}
          if-no-files-found: error
          retention-days: 14