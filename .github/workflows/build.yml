name: Expo Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (from eas.json)"
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: expo-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build (${{ matrix.platform }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS and wait for result
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            --json > build.json
          cat build.json

      - name: Download build file
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No build artifact URL found in EAS output"
            exit 1
          fi
          mkdir -p artifacts
          curl -fL "$URL" -o "artifacts/$(basename "${URL%%\?*}")"
          ls -lh artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ inputs.profile }}-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14